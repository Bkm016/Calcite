name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag (leave empty to auto-detect: latest or next for prereleases)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Run all checks and build tarball without publishing to npm or creating a GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Resolve version and validate tag
        id: meta
        env:
          INPUT_DIST_TAG: ${{ inputs.dist_tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node - <<'EOF'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const version = String(pkg.version || '').trim();
          if (!version) throw new Error('package.json is missing version');

          const refType = process.env.REF_TYPE;
          const refName = process.env.REF_NAME;
          const expectedTag = `v${version}`;
          if (refType === 'tag' && refName !== expectedTag) {
            throw new Error(`Tag "${refName}" does not match package.json version "${version}" (expected "${expectedTag}")`);
          }

          const prerelease = version.includes('-');
          const distTag = (process.env.INPUT_DIST_TAG || '').trim() || (prerelease ? 'next' : 'latest');

          // Extract matching "## <version>" section from CHANGELOG.md if present.
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const re = new RegExp(`^##\\s+${escaped}\\b[^\\n]*\\n([\\s\\S]*?)(?=^##\\s+|$(?![\\s\\S]))`, 'm');
          const match = re.exec(changelog);
          const notes = match ? match[1].trim() : '';
          if (notes) writeFileSync('/tmp/release-notes.md', `${notes}\n`, 'utf8');

          const out = process.env.GITHUB_OUTPUT;
          appendFileSync(out, `version=${version}\n`);
          appendFileSync(out, `tag=${expectedTag}\n`);
          appendFileSync(out, `prerelease=${prerelease}\n`);
          appendFileSync(out, `dist_tag=${distTag}\n`);
          appendFileSync(out, `has_notes=${notes.length > 0}\n`);
          console.log(`Resolved version=${version}, tag=${expectedTag}, dist_tag=${distTag}, prerelease=${prerelease}, has_notes=${notes.length > 0}`);
          EOF

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: CLI sanity
        run: |
          node dist/cli.js --version
          node dist/cli.js doctor

      - name: Pack tarball
        id: pack
        run: |
          tarball=$(npm pack --silent | tail -n 1)
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          tar -tzf "${tarball}" | head -n 40
          test -f vendor/calcite-probe.jar

      - name: Publish to npm
        if: ${{ inputs.dry_run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          if npm view "@bkm016/calcite@${VERSION}" version >/dev/null 2>&1; then
            echo "@bkm016/calcite@${VERSION} already exists on npm; skipping publish."
            exit 0
          fi
          npm publish "${TARBALL}" --access public --provenance --tag "${DIST_TAG}"

      - name: Create GitHub Release
        if: ${{ github.ref_type == 'tag' && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          HAS_NOTES: ${{ steps.meta.outputs.has_notes }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          args=(release create "${TAG}" "${TARBALL}" vendor/calcite-probe.jar --title "${TAG}")
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi
          if [ "${HAS_NOTES}" = "true" ]; then
            args+=(--notes-file /tmp/release-notes.md)
          else
            args+=(--generate-notes)
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading assets with --clobber."
            gh release upload "${TAG}" "${TARBALL}" vendor/calcite-probe.jar --clobber
          else
            gh "${args[@]}"
          fi
